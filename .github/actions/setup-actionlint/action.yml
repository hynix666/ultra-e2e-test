name: Set up actionlint
description: Installs a checksum-verified actionlint binary and puts it on PATH.
runs:
  using: composite
  steps:
    # Pinned by version AND by the SHA-256 in the release's checksums file, so a replaced release
    # asset fails the install instead of running. Bump both together.
    - name: Install actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      run: |
        dir="$RUNNER_TEMP/actionlint"
        mkdir -p "$dir"
        cd "$dir"
        tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
        echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
        tar -xzf "$tarball" actionlint
        echo "$dir" >> "$GITHUB_PATH"
