# release-please keeps an open "release" pull request that collects every Conventional Commit on
# main since the last release. Merging it tags the release and updates CHANGELOG.md.
#
# Off until the repository variable RELEASE_ENABLED is true, and it needs GitHub Actions to be allowed
# to create pull requests: `node scripts/configure-github.mjs` sets both after initialization.
#
# A pull request opened or updated with GITHUB_TOKEN starts no workflow runs, so the required `verify`
# check would never report on the release pull request, and it could never merge. workflow_dispatch is
# the documented exception, so the job below dispatches verify on the release branch; that run reports
# `verify` on the branch head, which is the commit the pull request needs. No personal token is
# required. Set a RELEASE_PLEASE_TOKEN secret only if release events must trigger other workflows.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Opt-in, like CodeQL and Pages. GitHub copies a template's content as the first commit of a new
    # repository and runs its workflows before anyone initializes it, so a release job that ran by
    # default would release the uninitialized template. It stays off until configure-github.mjs runs.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch verify on the release branch
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The pull request JSON reaches the shell through env and is parsed there. GitHub evaluates a
      # step's env before its `if`, so `fromJSON(steps.release.outputs.pr)` in env failed the job on
      # every push that created no pull request, even with this step skipped.
      - name: Dispatch verify on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName' <<< "$PR")"
          gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  # Publishes packages/ts-library at the version just released, with provenance. Opt-in: npm must trust
  # this workflow first (packages/ts-library/README.md), so it runs only when NPM_PUBLISH_ENABLED is true.
  # No npm token exists anywhere: id-token: write lets npm verify the workflow through OpenID Connect.
  publish-library:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/ts-library
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing needs"); process.exit(1); }' "$(npm --version)"
      - run: npm ci
      - name: Set the version from the release tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version
      - run: npm publish
