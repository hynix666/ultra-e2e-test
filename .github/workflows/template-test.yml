# Template-only: init deletes this workflow.
#
# The template is only as good as what it generates, so this generates a project from every preset
# and runs that project's own setup, verify and actionlint — the approach CleanArchitecture's
# test-templates.yml takes with `dotnet new`. A marker in the wrong place, a feature that silently
# depends on another, or a workflow that stops parsing once a block is removed fails here, before
# anyone creates a repository from it.
name: template-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preset:
    name: preset (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, go-api, fullstack-ts, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api-go/go.mod
          cache: false
      - uses: ./.github/actions/setup-actionlint

      - name: Generate
        env:
          PRESET: ${{ matrix.preset }}
        run: node template/init.mjs --name demo-app --owner octo-org --preset "$PRESET" --out "$RUNNER_TEMP/generated"

      - name: Commit, install and verify the generated project
        run: |
          cd "$RUNNER_TEMP/generated"
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "chore: initialize project"
          node scripts/setup.mjs
          node scripts/verify.mjs
          actionlint -color
