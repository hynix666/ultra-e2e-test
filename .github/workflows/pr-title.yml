# Checks the pull request TITLE against Conventional Commits. Pull requests are squash-merged, so
# the title becomes the commit on main — and, with release-please, decides the next version.
#
# pull_request_target runs the workflow from the base branch, which is what lets it check pull
# requests from forks. That trigger is safe here only because this job never checks out or runs
# the pull request's code and its token is read-only. Both must stay true.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Written out so an action upgrade cannot change the contribution rules silently.
          # CONTRIBUTING.md and dependabot.yml depend on this list.
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
